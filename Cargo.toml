[package]
name = "rust_shot"
version = "0.1.5"
edition = "2024"
description = "RustShot - 轻量级 Windows 截图 / 标注 / 贴图工具"
authors = ["RustShot"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3.7"
rfd = "0.18"
tiny-skia = "0.12"
fontdue = "0.9"
tray-icon = "0.26"
muda = "0.21"

[build-dependencies]
winres = "0.1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_Networking_WinHttp",
  "Win32_System_Registry",
  "Win32_Globalization",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
